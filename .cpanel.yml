---
deployment:
  tasks:

    # ==========================================================
    # PATH CONFIGURATION
    # ==========================================================

    - export REPOPATH=/home/ernando2/repositories/ernandojanuarpratama
    - export APPPATH=/home/ernando2/ernando-portofolio
    - export PUBLICPATH=/home/ernando2/public_html

    # ==========================================================
    # PREPARE DIRECTORIES
    # ==========================================================

    - /bin/mkdir -p $APPPATH
    - /bin/mkdir -p $PUBLICPATH

    # ==========================================================
    # LARAVEL APPLICATION
    # Source code stays OUTSIDE public_html
    # ==========================================================

    - /bin/cp -R $REPOPATH/app $APPPATH/
    - /bin/cp -R $REPOPATH/bootstrap $APPPATH/
    - /bin/cp -R $REPOPATH/config $APPPATH/
    - /bin/cp -R $REPOPATH/database $APPPATH/
    - /bin/cp -R $REPOPATH/resources $APPPATH/
    - /bin/cp -R $REPOPATH/routes $APPPATH/

    # ==========================================================
    # LARAVEL ROOT FILES
    # ==========================================================

    - /bin/cp $REPOPATH/artisan $APPPATH/
    - /bin/cp $REPOPATH/composer.json $APPPATH/
    - /bin/cp $REPOPATH/composer.lock $APPPATH/
    - /bin/cp $REPOPATH/package.json $APPPATH/
    - /bin/cp $REPOPATH/package-lock.json $APPPATH/
    - /bin/cp $REPOPATH/phpunit.xml $APPPATH/
    - /bin/cp $REPOPATH/vite.config.js $APPPATH/
    - /bin/cp $REPOPATH/README.md $APPPATH/

    # ==========================================================
    # IMPORTANT:
    # DO NOT COPY:
    # - .env
    # - storage
    # - vendor
    # - node_modules
    #
    # These are server-side / persistent files.
    # ==========================================================

    # ==========================================================
    # PUBLIC FILES
    # Copy Laravel public directory directly to public_html
    # ==========================================================

    - /bin/cp $REPOPATH/public/.htaccess $PUBLICPATH/
    - /bin/cp $REPOPATH/public/index.php $PUBLICPATH/
    - /bin/cp $REPOPATH/public/robots.txt $PUBLICPATH/
    - /bin/cp $REPOPATH/public/favicon.ico $PUBLICPATH/
    - /bin/cp $REPOPATH/public/og-image.png $PUBLICPATH/

    # ==========================================================
    # BUILD FRONTEND ASSETS
    # ==========================================================

    - export NODEBIN=/home/ernando2/nodevenv/ernando-portofolio/20/bin
    - cd $REPOPATH && $NODEBIN/npm ci
    - cd $REPOPATH && $NODEBIN/npm run build

    - /bin/mkdir -p $APPPATH/public/build
    - /bin/rm -rf $APPPATH/public/build/*
    - /bin/cp -R $REPOPATH/public/build/* $APPPATH/public/build/

    - /bin/mkdir -p $PUBLICPATH/build
    - /bin/rm -rf $PUBLICPATH/build/*
    - /bin/cp -R $REPOPATH/public/build/* $PUBLICPATH/build/

    # ==========================================================
    # COMPOSER
    # ==========================================================

    - cd $APPPATH && /usr/local/bin/ea-php83 /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction

    # ==========================================================
    # LARAVEL CACHE
    # ==========================================================

    - cd $APPPATH && /usr/local/bin/ea-php83 artisan optimize:clear
    - cd $APPPATH && /usr/local/bin/ea-php83 artisan config:cache
    - cd $APPPATH && /usr/local/bin/ea-php83 artisan route:cache
    - cd $APPPATH && /usr/local/bin/ea-php83 artisan view:cache

    # ==========================================================
    # STORAGE LINK
    # ==========================================================

    - cd $APPPATH && /usr/local/bin/ea-php83 artisan storage:link || true

    # ==========================================================
    # PERMISSIONS
    # ==========================================================

    - /bin/chmod -R 775 $APPPATH/storage
    - /bin/chmod -R 775 $APPPATH/bootstrap/cache