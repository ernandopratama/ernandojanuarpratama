---
deployment:
  tasks:
    - export DEPLOYPATH=/home/ernando2/public_html/

    # ==========================================
    # Laravel Application
    # ==========================================

    - /bin/cp -R app $DEPLOYPATH
    - /bin/cp -R bootstrap $DEPLOYPATH
    - /bin/cp -R config $DEPLOYPATH
    - /bin/cp -R database $DEPLOYPATH
    - /bin/cp -R resources $DEPLOYPATH
    - /bin/cp -R routes $DEPLOYPATH
    - /bin/cp -R tests $DEPLOYPATH

    # ==========================================
    # Laravel Root Files
    # ==========================================

    - /bin/cp artisan $DEPLOYPATH
    - /bin/cp composer.json $DEPLOYPATH
    - /bin/cp composer.lock $DEPLOYPATH
    - /bin/cp package.json $DEPLOYPATH
    - /bin/cp package-lock.json $DEPLOYPATH
    - /bin/cp phpunit.xml $DEPLOYPATH
    - /bin/cp vite.config.js $DEPLOYPATH
    - /bin/cp README.md $DEPLOYPATH

    # ==========================================
    # Public Files
    # IMPORTANT:
    # Do NOT copy public/storage (symlink)
    # Do NOT copy public/build (compiled assets, upload manual after npm run build)
    # ==========================================

    - /bin/mkdir -p $DEPLOYPATH/public
    - /bin/cp public/.htaccess $DEPLOYPATH/public/
    - /bin/cp public/index.php $DEPLOYPATH/public/
    - /bin/cp public/robots.txt $DEPLOYPATH/public/
    - /bin/cp public/favicon.ico $DEPLOYPATH/public/
    - /bin/cp public/og-image.png $DEPLOYPATH/public/

    # ==========================================
    # Permissions
    # ==========================================

    - /bin/chmod -R 775 $DEPLOYPATH/storage $DEPLOYPATH/bootstrap/cache
